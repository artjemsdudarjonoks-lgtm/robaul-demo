<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RobauL | Daugavpils</title>
<style>
:root{color-scheme:light;--bg:#fff;--bg2:#f4f5f6;--tx:#1f2933;--mut:#5d6872;--ac:#f5a81c;--ln:#dfe3e6;--dk:#1f2933;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:50}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:#fff;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 5vw}
header img{height:44px;display:block}
nav{display:flex;gap:26px}
nav a{color:var(--tx);text-decoration:none;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;padding:6px 0;border-bottom:2px solid transparent;transition:.2s}
nav a:hover{border-color:var(--ac)}
.lang{display:flex}
.lang button{background:#fff;border:1px solid var(--ln);margin-left:-1px;color:var(--tx);font:600 12px "Helvetica Neue",Arial,sans-serif;letter-spacing:1px;padding:7px 12px;cursor:pointer}
.lang button.on{background:var(--dk);border-color:var(--dk);color:#fff}
.hero{background:var(--bg2);padding:64px 5vw 0;display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:end;overflow:hidden;border-bottom:6px solid var(--ac)}
.hero .tx{padding-bottom:64px}
.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--mut);font-weight:700}
.hero h1{font-size:clamp(32px,4.4vw,56px);line-height:1.1;margin:14px 0 18px;font-weight:800;letter-spacing:-.5px}
.hero h1::after{content:"";display:block;height:5px;width:0;background:var(--ac);margin-top:18px;animation:ln 1.2s .3s ease forwards}
@keyframes ln{to{width:110px}}
.hero p{color:var(--mut);max-width:480px;margin:0 0 26px}
.btn{display:inline-block;background:var(--dk);color:#fff;padding:13px 28px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;text-decoration:none;border:2px solid var(--dk);margin-right:10px;transition:.2s}
.btn:hover{background:var(--ac);border-color:var(--ac);color:var(--dk)}
.btn.o{background:none;color:var(--dk)}
.truck{width:100%;display:block;mix-blend-mode:multiply;animation:in 1.4s ease both}
@keyframes in{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
section{padding:80px 5vw}
section.alt{background:var(--bg2)}
.wrap{max-width:1100px;margin:0 auto}
h2{font-size:13px;letter-spacing:3px;text-transform:uppercase;font-weight:800;margin:0 0 10px;padding-left:16px;border-left:5px solid var(--ac)}
.h{font-size:clamp(26px,3.4vw,38px);font-weight:800;line-height:1.2;margin:0 0 18px;max-width:720px}
.lead{color:var(--mut);max-width:720px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);margin-top:32px}
.facts div{background:#fff;padding:20px 22px}
.facts b{display:block;font-size:26px}
.facts span{color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px;margin-top:32px}
.card{background:#fff;border:1px solid var(--ln);opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.card.in{opacity:1;transform:none}
.card .im{overflow:hidden;background:#fff;height:260px;border-bottom:4px solid var(--ac)}
.card img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .8s}
.card:hover img{transform:scale(1.04)}
.card h3{margin:0;padding:20px 24px 4px;font-size:20px}
.card dl{margin:0;padding:8px 24px 22px;display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px}
.card dt{color:var(--mut);text-transform:uppercase;font-size:11px;letter-spacing:1px;padding-top:2px}
.card dd{margin:0}
.tbc{color:#9aa3ab;font-style:italic}
.note{border-left:3px solid var(--ac);padding:4px 0 4px 16px;margin-top:28px;color:var(--mut);font-size:14px;max-width:720px}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);margin-top:30px}
.contact a,.contact div{background:#fff;padding:22px 24px;color:var(--tx);text-decoration:none;font-weight:600;font-size:17px;transition:.2s}
.contact a:hover{background:var(--dk);color:#fff}
.contact small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px;font-weight:700}
footer{background:var(--dk);color:#aab3bb;padding:28px 5vw;font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;border-top:6px solid var(--ac)}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:40px}.hero .tx{padding-bottom:10px}nav{display:none}header img{height:36px}.card dl{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}.hero h1::after{width:110px}}

header{padding-bottom:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--dk)}
.brand img{height:42px;mix-blend-mode:multiply}
.brand b{font-size:24px;font-weight:900;letter-spacing:2px}.brand b i{font-style:normal;color:var(--ac)}
.road{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--ln)}
.road u{position:absolute;left:0;top:0;height:3px;width:0;background:var(--ac)}
.road img{position:absolute;bottom:3px;height:20px;transform:translateX(-50%) scaleX(-1);mix-blend-mode:multiply;left:0}
.hero{grid-template-columns:1fr 1.15fr;align-items:center;padding-top:48px;background:linear-gradient(180deg,#fff 0,var(--bg2) 100%)}
.hero .lg{width:min(440px,100%);display:block;margin-bottom:26px;animation:fade 1.1s both}
.hero .tx{padding-bottom:56px}
.stage{position:relative;padding-bottom:34px;overflow:hidden}
.tw{will-change:transform}
.truck{animation:arrive 1.8s cubic-bezier(.16,.8,.3,1) both,idle .55s ease-in-out 1.8s infinite alternate;transform-origin:50% 100%}
@keyframes arrive{from{transform:translateX(110%) skewX(-6deg);opacity:0}60%{opacity:1}to{transform:none}}
@keyframes idle{from{transform:translateY(0)}to{transform:translateY(-2px) rotate(-.15deg)}}
.rd{position:absolute;left:-10%;right:-10%;bottom:12px;height:4px;background:repeating-linear-gradient(90deg,var(--dk) 0 46px,transparent 46px 92px);background-size:92px 4px;animation:rd 1.1s linear infinite;opacity:.8}
@keyframes rd{to{background-position:92px 0}}
.sp{position:absolute;right:0;height:3px;background:var(--ac);opacity:0;animation:sp 1.8s ease-out both}
.sp:nth-of-type(1){top:30%;width:120px}.sp:nth-of-type(2){top:46%;width:180px;animation-delay:.1s}.sp:nth-of-type(3){top:62%;width:90px;animation-delay:.2s}
@keyframes sp{0%{opacity:0;transform:translateX(40px)}30%{opacity:.9}100%{opacity:0;transform:translateX(-160px)}}
@keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card{transition-delay:var(--d,0s)}
.ph{height:240px;background:var(--bg2);border-bottom:4px solid var(--ac);display:grid;place-items:center;color:#c3cad0;overflow:hidden;position:relative}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%);transform:translateX(-100%);animation:shim 3.2s infinite}
@keyframes shim{to{transform:translateX(100%)}}
.ph svg{width:54px;height:54px}
.card img.real{height:240px;object-fit:cover}
.bar{height:14px;background:var(--bg2);margin:0 24px 10px;border-radius:2px}
.bar.t{height:22px;width:62%;margin-top:20px;margin-bottom:14px}
.bar.s{width:88%}.bar.m{width:70%;margin-bottom:22px}
.card{transition:opacity .8s,transform .8s,box-shadow .3s}
.card:hover{box-shadow:0 18px 40px rgba(31,41,51,.12);transform:translateY(-6px)}
.drive{position:relative;height:64px;background:#fff;overflow:hidden;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.drive::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:3px;background:repeating-linear-gradient(90deg,var(--ac) 0 40px,transparent 40px 80px);background-size:80px 3px;animation:rd 1.4s linear infinite}
.drive img{position:absolute;bottom:10px;height:46px;right:-140px;mix-blend-mode:multiply;transition:transform 5.5s cubic-bezier(.4,0,.2,1)}
.drive.in img{transform:translateX(calc(-100vw - 280px))}
.btn.wa{background:#1f2933}
@media(max-width:820px){.hero .lg{width:min(300px,80%)}header{padding-bottom:22px}}
@media(prefers-reduced-motion:reduce){.truck,.rd,.sp,.ph::after,.drive::after{animation:none}.drive img{right:20px;transition:none}}

.truck{animation:arrive 1.6s cubic-bezier(.16,.8,.3,1) both,float 6s ease-in-out 1.6s infinite alternate;width:100%;max-width:640px;margin:0 auto;display:block;mix-blend-mode:multiply}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.stage{padding-bottom:0}
